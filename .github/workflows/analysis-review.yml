name: Analysis review replay (no video collection)
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      decision_path:
        description: Optional reviewed decision JSON under automation/decisions/
        default: ''
permissions:
  contents: read
concurrency:
  group: wapobook-analysis-review
  cancel-in-progress: false
jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || vars.WAPO_ANALYSIS_REPLAY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: wapobook-analysis-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline policy and queue tests
        run: python -m unittest discover -s tests/automation -v
      - name: Produce review artifacts; do not collect streams or publish
        env:
          DECISION_PATH: ${{ inputs.decision_path }}
        run: |
          python - <<'PY'
          import os,pathlib,subprocess
          decision=os.environ.get('DECISION_PATH','')
          args=['python','automation/runner.py']
          if decision:
              path=pathlib.PurePosixPath(decision)
              assert not path.is_absolute() and '..' not in path.parts and str(path).startswith('automation/decisions/')
              args+=['--decisions',str(path)]
          subprocess.run(args,check=True)
          PY
      - name: Redact pending evidence for public repository artifacts
        run: python automation/public_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-review-${{ github.run_id }}
          path: artifacts/public-review/
          retention-days: 7
